name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · coverage · path-dep gate.
  #
  # MSRV is read from rust-version (1.85), which is what the old `msrv` job
  # pinned by hand, so it needs no input.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@f9802dca64a95eb881fd05dd3f4f16e53b97f2b3
    with:
      # Carried across, NOT relaxed: the old coverage job ran
      # `cargo llvm-cov --workspace --all-features --fail-under-lines 90`.
      # 90 is a deliberate aggregate floor — the residual uncovered lines are
      # env-gated live-acquisition paths that cannot run on a CI runner, and
      # annotating them `// cov:unreachable` would be dishonest (they are
      # reachable, just not from here). Inheriting the default strict per-line
      # gate would be a behaviour change smuggled into an adoption PR.
      coverage-gate: floor
      coverage-floor: 90

  # Repo-specific reporting, copied verbatim from the old ci.yml. Not a gate
  # (continue-on-error), so it stays outside the shared workflow.
  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true
